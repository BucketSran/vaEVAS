[package]
name = "evas-kernel"
version = "0.13.0"
edition = "2021"

[workspace]
members = ["ir"]
resolver = "2"

[dependencies]
num-rational = "=0.4.2"
num-traits = "=0.2.19"
evas-ir = { path = "ir", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }

[[bench]]
name = "static_solver"
harness = false

[[bench]]
name = "transient_solver"
harness = false

[dev-dependencies]
proptest = "=1.11.0"
