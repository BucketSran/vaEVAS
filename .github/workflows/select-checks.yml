name: Select CI checks

on:
  workflow_call:
    outputs:
      full:
        value: ${{ jobs.selection.outputs.full }}
      package:
        value: ${{ jobs.selection.outputs.package }}
      benchmark:
        value: ${{ jobs.selection.outputs.benchmark }}
      base:
        value: ${{ jobs.selection.outputs.base }}
      head:
        value: ${{ jobs.selection.outputs.head }}

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      package: ${{ steps.changes.outputs.package }}
      benchmark: ${{ steps.changes.outputs.benchmark }}
      base: ${{ steps.changes.outputs.base }}
      head: ${{ steps.changes.outputs.head }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: changes
        run: python3 -B scripts/ci_selection.py select
