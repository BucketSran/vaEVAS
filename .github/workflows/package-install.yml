name: Installed EVAS package

on:
  workflow_call:
    outputs:
      install_result:
        value: ${{ jobs.install.outputs.result }}

permissions:
  contents: read

# Fixed Rust toolchain for the sdist build, which uses it through rustup.
env:
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  install:
    outputs:
      result: ${{ steps.verified.outputs.result }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            python: '3.10.22'
          - runner: macos-14
            arch: arm64
            python: '3.12.10'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: evas/pyproject.toml
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: ./.github/actions/rust-cache
        with:
          # Cache downloads only. The sdist must build its own fresh executable.
          lane: package-downloads
      - name: Verify actual runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python -c "import os,platform; assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine()"
      - run: python -m pip install build==1.6.1
      - name: Build sdist, then build native wheel from that archive
        run: |
          python -m build --sdist --outdir runs/package-dist evas
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir runs/package-dist runs/package-dist/*.tar.gz
      - name: Install outside checkout, verify equations, failures and reinstall
        run: |
          python scripts/check_installed_evas.py --wheel runs/package-dist/*.whl --sdist runs/package-dist/*.tar.gz --out runs/package-install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-${{ matrix.runner }}-${{ matrix.arch }}-py${{ matrix.python }}
          path: |
            runs/package-dist
            runs/package-install
          if-no-files-found: ignore
          retention-days: 14
      - name: Record completed checks
        id: verified
        run: echo "result=success" >> "$GITHUB_OUTPUT"
