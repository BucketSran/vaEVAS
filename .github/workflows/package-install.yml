name: Installed EVAS package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-install-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    uses: ./.github/workflows/select-checks.yml
  install:
    needs: selection
    if: needs.selection.outputs.package == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            python: '3.10'
          - runner: macos-14
            arch: arm64
            python: '3.12'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install stable --profile minimal
      - name: Verify actual runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python -c "import os,platform; assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine()"
      - run: python -m pip install build
      - name: Build sdist, then build native wheel from that archive
        run: |
          python -m build --sdist --outdir runs/package-dist evas
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir runs/package-dist runs/package-dist/*.tar.gz
      - name: Install outside checkout, verify equations, failures and reinstall
        run: |
          python scripts/check_installed_evas.py --wheel runs/package-dist/*.whl --sdist runs/package-dist/*.tar.gz --out runs/package-install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-${{ matrix.runner }}-${{ matrix.arch }}-py${{ matrix.python }}
          path: |
            runs/package-dist
            runs/package-install
          if-no-files-found: ignore
          retention-days: 14
  package-result:
    needs: [selection, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require both selected installation platforms to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_selection.py gate --lane package
