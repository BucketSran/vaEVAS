name: Benchmark evidence

on:
  workflow_call:
    outputs:
      identity_result:
        value: ${{ jobs.identity.outputs.result }}
      first_batch_result:
        value: ${{ jobs.first-batch.outputs.result }}

permissions:
  contents: read

jobs:
  identity:
    outputs:
      result: ${{ steps.verified.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Frozen sources and current calibration consumers
        run: python3 -B -m experiments.va_screen.identity --historical
      - name: Current task registration and generated indexes
        run: python3 -B scripts/benchmark_workbench.py --check
      - name: Task registration, stage checks and preservation regressions
        run: python3 -B -m unittest scripts.tests.test_benchmark_workbench scripts.tests.test_benchmark_package -v
      - name: Historical material path and frozen-plan consumers
        run: python3 -B -m unittest experiments.test_benchmark_paths -v
      - name: Identity and result reporting regressions
        run: python3 -B -m unittest experiments.va_screen.test_identity experiments.va_screen.test_summarize -v
      - name: Saved-candidate EVAS replay regressions
        run: python3 -B -m unittest discover -s benchmark/material/historyref/legacy-authoring/checkers -p test_triangle_evas_replay.py -v
      - name: Record completed checks
        id: verified
        run: echo "result=success" >> "$GITHUB_OUTPUT"
  first-batch:
    outputs:
      result: ${{ steps.verified.outputs.result }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Portable checker copies and task lineage
        run: |
          python3 -B experiments/benchmark_first_batch/sync_runtime.py --check
          python3 -B experiments/benchmark_first_batch/sync_metadata.py --check
      - name: Independent criteria and evidence boundary regressions
        run: |
          for directory in experiments/benchmark_v2 experiments/benchmark_first_batch experiments/benchmark_first_batch/model_repair experiments/benchmark_first_batch/identification experiments/benchmark_first_batch/integration experiments/benchmark_first_batch/verification_measurement experiments/benchmark_first_batch/optimization experiments/benchmark_first_batch/legacy_va07 experiments/benchmark_first_batch/agentic; do
            python3 -B -m unittest discover -s "$directory" -p 'test_*.py' -v || exit $?
          done
          if [ -d experiments/benchmark_next ]; then
            for directory in experiments/benchmark_next/*; do
              if [ -d "$directory" ]; then
                python3 -B -m unittest discover -s "$directory" -p 'test_*.py' -v || exit $?
              fi
            done
          fi
      - name: Record completed checks
        id: verified
        run: echo "result=success" >> "$GITHUB_OUTPUT"
